# .github/workflows/pipeline.yml

name: Provision & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.tf', 'cloud-init/**', 'templates/**']

env:
  TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
  TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
  TF_VAR_vm_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
  TF_VAR_ci_ssh_public_key: ${{ secrets.CI_SSH_PUBLIC_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
  BASE_REGISTRY: ghcr.io/tsuyakashi/swarm-lab
  GITHUB_REPO: Tsuyakashi/swarm-lab
  GITHUB_PAT: ${{ secrets.GH_RUNNER_PAT }}

jobs:
  provision:
    runs-on: self-hosted
    outputs:
      done: ${{ steps.apply.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key for Proxmox provider
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_SSH_PRIVATE_KEY }}" > ~/.ssh/proxmox_provider_key
          chmod 600 ~/.ssh/proxmox_provider_key
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/proxmox_provider_key

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        id: apply
        run: terraform apply -auto-approve -parallelism=1

  deploy:
    needs: provision
    runs-on: self-hosted
    steps:
      - name: Checkout iac-proxmox-lab (for ansible-inventory/)
        uses: actions/checkout@v4

      - name: Checkout swarm-lab
        uses: actions/checkout@v4
        with:
          repository: Tsuyakashi/swarm-lab
          ref: v0.3.3
          path: swarm-lab

      - name: Set up SSH key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/id_ed25519

      - name: Install Ansible collectionsenv.BASE_REGISTRY
        run: |
          ansible-galaxy collection install -r swarm-lab/ansible/requirements.yml
          ansible-galaxy collection install -r ansible-inventory/requirements.yml
 
      - name: Run playbook
        env:
          PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
        run: ansible-playbook -i ansible-inventory/proxmox.proxmox.yml swarm-lab/ansible/site.yml -e "base_registry=${{ env.BASE_REGISTRY }}"

# .github/workflows/pipeline.yml

name: Provision & Deploy

# on:
#   workflow_dispatch:
#   push:
#     branches: [main]
#     # modules/** — потому что environments/nodes зависит от modules/proxmox-vm;
#     # правки модуля должны прогонять тот же apply, что и правки самого environment.
#     paths: ['environments/nodes/**', 'modules/**']

on:
  workflow_dispatch:

env:
  TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
  TF_VAR_vm_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
  TF_VAR_ci_ssh_public_key: ${{ secrets.CI_SSH_PUBLIC_KEY }}
  BASE_REGISTRY: ghcr.io/tsuyakashi/swarm-lab
  GITHUB_REPO: Tsuyakashi/swarm-lab

jobs:
  provision:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: environments/nodes
    outputs:
      done: ${{ steps.apply.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Vault
        env:
          VAULT_ADDR: http://192.168.100.200:8200
        run: |
          VAULT_TOKEN=$(vault write -field=token auth/approle/login \
            role_id="${{ secrets.VAULT_ROLE_ID }}" \
            secret_id="${{ secrets.VAULT_SECRET_ID }}")
          echo "::add-mask::$VAULT_TOKEN"

          API_TOKEN=$(VAULT_TOKEN=$VAULT_TOKEN vault kv get -field=api_token proxmox/terraform-provider)
          echo "::add-mask::$API_TOKEN"
          echo "TF_VAR_proxmox_api_token=$API_TOKEN" >> "$GITHUB_ENV"

          VAULT_TOKEN=$VAULT_TOKEN vault kv get -field=private_key proxmox/ci-ssh-key > ~/.ssh/ci_private_key_from_vault

          MINIO_ACCESS_KEY=$(VAULT_TOKEN=$VAULT_TOKEN vault kv get -field=access_key proxmox/minio-credentials)
          MINIO_SECRET_KEY=$(VAULT_TOKEN=$VAULT_TOKEN vault kv get -field=secret_key proxmox/minio-credentials)
          echo "::add-mask::$MINIO_ACCESS_KEY"
          echo "::add-mask::$MINIO_SECRET_KEY"
          echo "AWS_ACCESS_KEY_ID=$MINIO_ACCESS_KEY" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=$MINIO_SECRET_KEY" >> "$GITHUB_ENV"

      - name: Set up SSH key for Proxmox provider
        run: |
          mkdir -p ~/.ssh
          cp ~/.ssh/ci_private_key_from_vault ~/.ssh/proxmox_provider_key
          chmod 600 ~/.ssh/proxmox_provider_key
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/proxmox_provider_key

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        id: apply
        run: terraform apply -auto-approve

      - uses: actions/upload-artifact@v4
        with:
          name: inventory
          path: environments/nodes/inventory.ini

  deploy:
    needs: provision
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inventory
      - uses: actions/checkout@v4
        with:
          repository: Tsuyakashi/swarm-lab
          ref: v0.3.3
          path: swarm-lab

      - name: Fetch secrets from Vault
        env:
          VAULT_ADDR: http://192.168.100.200:8200
        run: |
          VAULT_TOKEN=$(vault write -field=token auth/approle/login \
            role_id="${{ secrets.VAULT_ROLE_ID }}" \
            secret_id="${{ secrets.VAULT_SECRET_ID }}")
          echo "::add-mask::$VAULT_TOKEN"

          VAULT_TOKEN=$VAULT_TOKEN vault kv get -field=private_key proxmox/ci-ssh-key > ~/.ssh/id_ed25519_from_vault

          GH_PAT=$(VAULT_TOKEN=$VAULT_TOKEN vault kv get -field=token proxmox/github-runner-pat)
          echo "::add-mask::$GH_PAT"
          echo "GITHUB_PAT=$GH_PAT" >> "$GITHUB_ENV"

      - name: Set up SSH key for Ansible
        run: |
          mkdir -p ~/.ssh
          cp ~/.ssh/id_ed25519_from_vault ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/id_ed25519

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r swarm-lab/ansible/requirements.yml

      - name: Wait for nodes to finish booting
        run: |
          for host in $(awk '/ansible_host=/{print $2}' inventory.ini | cut -d= -f2); do
            echo "Waiting for SSH on $host..."
            timeout 120 bash -c "until nc -z $host 22; do sleep 3; done"
            echo "Waiting for cloud-init on $host..."
            timeout 180 ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ubuntu@$host \
              'cloud-init status --wait'
          done

      - name: Run playbook
        run: ansible-playbook -i inventory.ini swarm-lab/ansible/site.yml -e "base_registry=${{ env.BASE_REGISTRY }}"

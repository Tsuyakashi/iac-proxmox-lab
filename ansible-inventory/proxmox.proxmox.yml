plugin: community.proxmox.proxmox
url: "{{ lookup('env', 'PROXMOX_ENDPOINT') }}"
user: "terraform@pve"
token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
validate_certs: false
want_facts: true

# Only pick up nodes provisioned by this repo (excludes ci-runner, the
# golden template, and anything else living on the same Proxmox host).
filters:
  - "proxmox_tags_parsed is defined and ('prod' in proxmox_tags_parsed or 'stage' in proxmox_tags_parsed or 'dev' in proxmox_tags_parsed)"

# Map Proxmox tags onto the SAME group names swarm-lab/ansible/site.yml
# and the Vagrantfile already use — so site.yml needs zero changes and
# `vagrant provision` keeps working unmodified.
groups:
  swarm_managers: "proxmox_tags_parsed is defined and 'prod' in proxmox_tags_parsed"
  swarm_workers: "proxmox_tags_parsed is defined and ('stage' in proxmox_tags_parsed or 'dev' in proxmox_tags_parsed)"

compose:
  ansible_host: >-
    (proxmox_agent_interfaces
      | default([])
      | selectattr('name', 'equalto', 'eth0')
      | list | first | default({})
    ).get('ip-addresses', [])
      | selectattr('ip-address-type', 'equalto', 'ipv4')
      | map(attribute='ip-address') | first | default('')
  tag_name: "proxmox_tags_parsed | first | default('')"
